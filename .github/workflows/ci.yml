name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # next build은 Supabase/Anthropic에 실제로 접속하지 않고도 통과한다
          # (클라이언트 생성은 런타임 요청 시점에만 실행됨). 실제 키는 CI에 두지 않고
          # placeholder 값만 넣어 env 변수 자체가 없을 때 발생하는 타입/런타임 에러만 방지한다.
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
          ANTHROPIC_API_KEY: "placeholder-key"
